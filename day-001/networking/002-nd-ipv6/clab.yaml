name: nd-ipv6

topology:
  nodes:
    h1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        # Just add v6 address and test with this
        - ip addr add 2001:db8:1::1/64 dev eth1
        - ip link set eth1 up

    sw1:
      kind: linux
      image: alpine:latest
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0

    h2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        # Just add v6 address and test with this
        - ip addr add 2001:db8:1::2/64 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: [ "h1:eth1", "sw1:eth1" ]
    - endpoints: [ "sw1:eth2", "h2:eth1" ]
