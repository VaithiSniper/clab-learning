name: bgp-unicast-rr

topology:
  nodes:

    rr1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0

      binds:
        - configs/rr1/frr.conf:/etc/frr/frr.conf
        - configs/rr1/vtysh.conf:/etc/frr/vtysh.conf
        - configs/rr1/daemons:/etc/frr/daemons

      exec:
        - ip addr add 10.0.1.0/31 dev eth1
        - ip addr add 10.0.1.2/31 dev eth2
        - ip addr add 10.0.0.1/32 dev lo
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set lo up
        - ip route add 10.0.0.11/32 via 10.0.1.1
        - ip route add 10.0.0.22/32 via 10.0.1.3

    pe1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0

      binds:
        - configs/pe1/frr.conf:/etc/frr/frr.conf
        - configs/rr1/vtysh.conf:/etc/frr/vtysh.conf
        - configs/rr1/daemons:/etc/frr/daemons

      exec:
        - ip addr add 10.0.1.1/31 dev eth1
        - ip addr add 10.0.10.0/31 dev eth2
        - ip addr add 10.0.0.11/32 dev lo
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set lo up
        - ip route add 10.0.0.1/32 via 10.0.1.0
        - ip route add 10.0.0.22/32 via 10.0.1.0

    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0

      binds:
        - configs/pe2/frr.conf:/etc/frr/frr.conf
        - configs/rr1/vtysh.conf:/etc/frr/vtysh.conf
        - configs/rr1/daemons:/etc/frr/daemons

      exec:
        - ip addr add 10.0.1.3/31 dev eth1
        - ip addr add 10.0.20.0/31 dev eth2
        - ip addr add 10.0.0.22/32 dev lo
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set lo up
        - ip route add 10.0.0.1/32 via 10.0.1.2
        - ip route add 10.0.0.11/32 via 10.0.1.2

    ce1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0

      binds:
        - configs/ce1/frr.conf:/etc/frr/frr.conf
        - configs/rr1/vtysh.conf:/etc/frr/vtysh.conf
        - configs/rr1/daemons:/etc/frr/daemons

      exec:
        - ip addr add 10.0.10.1/31 dev eth1
        - ip addr add 10.1.1.1/32 dev lo
        - ip link set eth1 up
        - ip link set lo up

    ce2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0

      binds:
        - configs/ce2/frr.conf:/etc/frr/frr.conf
        - configs/rr1/vtysh.conf:/etc/frr/vtysh.conf
        - configs/rr1/daemons:/etc/frr/daemons

      exec:
        - ip addr add 10.0.20.1/31 dev eth1
        - ip addr add 10.2.2.2/32 dev lo
        - ip link set eth1 up
        - ip link set lo up

  links:

    - endpoints:
        - rr1:eth1
        - pe1:eth1

    - endpoints:
        - rr1:eth2
        - pe2:eth1

    - endpoints:
        - pe1:eth2
        - ce1:eth1

    - endpoints:
        - pe2:eth2
        - ce2:eth1
