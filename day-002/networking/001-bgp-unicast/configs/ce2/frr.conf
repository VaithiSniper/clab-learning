frr version 10.7.0
frr defaults traditional
hostname ce2
!
ip prefix-list CE2-LO seq 10 permit 10.2.2.2/32
!
route-map CE2-LO-RM-OUT permit 10
 match ip address prefix-list CE2-LO
exit
!
router bgp 65200
 bgp router-id 10.2.2.2
 neighbor 10.0.20.0 remote-as 65000
 !
 address-family ipv4 unicast
  network 10.2.2.2/32
  neighbor 10.0.20.0 activate
  neighbor 10.0.20.0 route-map CE2-LO-RM-OUT out
 exit-address-family
!

line vty
