frr version 10.7.0
frr defaults traditional
hostname pe1
!
ip prefix-list CE1-LO seq 10 permit 10.1.1.1/32
!
route-map CE1-LO-RM-IN permit 10
 match ip address prefix-list CE1-LO
exit
!
router bgp 65000
 bgp router-id 10.0.0.11
 neighbor 10.0.1.0 remote-as 65000
 neighbor 10.0.10.1 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.0.0.11/32
  neighbor 10.0.1.0 activate
  ! Overwrite next-hop when advertising to ibgp fabric since we are CE-facing PE.
  neighbor 10.0.1.0 next-hop-self
  neighbor 10.0.10.1 activate
  neighbor 10.0.10.1 route-map CE1-LO-RM-IN in
 exit-address-family
!

line vty
