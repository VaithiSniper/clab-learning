frr version 10.7.0_git
frr defaults traditional
hostname pe2
service integrated-vtysh-config
!
vrf blue
exit-vrf
!
vrf green
exit-vrf
!
vrf red
exit-vrf
!
interface eth2
 ip address 192.0.2.10/30
 mpls enable
exit
!
interface eth3
 ip address 10.1.1.1/24
exit
!
interface eth4
 ip address 10.2.1.1/24
exit
!
interface eth5
 ip address 10.3.1.1/24
exit
!
interface lo
 ip address 4.4.4.4/32
exit
!
router bgp 65000
 bgp router-id 4.4.4.4
 no bgp default ipv4-unicast
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source lo
 neighbor 192.0.2.9 remote-as 65000
 neighbor 192.0.2.9 update-source eth2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  network 4.4.4.4/32
  neighbor 192.0.2.9 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 1.1.1.1 activate
 exit-address-family
exit
!
router bgp 65000 vrf red
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:200
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-pip
 exit-address-family
exit
!
router bgp 65000 vrf green
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:201
  rt vpn both 65000:101
  export vpn
  import vpn
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-pip
 exit-address-family
exit
!
router bgp 65000 vrf blue
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:202
  rt vpn both 65000:102
  export vpn
  import vpn
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-pip
 exit-address-family
exit
!
