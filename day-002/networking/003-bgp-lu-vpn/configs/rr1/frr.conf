frr defaults traditional
hostname rr1
!
router bgp 65000
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 neighbor 192.0.2.1 remote-as 65000
 neighbor 192.0.2.6 remote-as 65000
 !
 address-family ipv4 labeled-unicast
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 route-reflector-client
  neighbor 192.0.2.1 next-hop-self force
  neighbor 192.0.2.6 activate
  neighbor 192.0.2.6 route-reflector-client
  neighbor 192.0.2.6 next-hop-self force
  network 2.2.2.2/32
 exit-address-family
!
interface lo
 ip address 2.2.2.2/32
!
interface eth1
 ip address 192.0.2.2/30
 mpls enable
!
interface eth2
 ip address 192.0.2.5/30
 mpls enable
!
